# Local production-like stack: Postgres 17 + the multi-tenant API (login required).
#   cp .env.example .env   # then set AUTH_SECRET (openssl rand -base64 48) and the SEED_* demo users
#   docker compose up --build
#   API: http://localhost:8787/readyz     Console: npm run dev  (Vite proxies /api to :8787)
# Ports bind to 127.0.0.1 only. The passwords below are local-dev defaults; override them in .env.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: receptionist
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres-local-only}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-receptionist-app-local-only}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d receptionist"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8787
      # app role (not superuser) so row-level security applies; migrations run on boot
      DATABASE_URL: postgres://receptionist_app:${APP_DB_PASSWORD:-receptionist-app-local-only}@db:5432/receptionist
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env (openssl rand -base64 48)}
      AUTH_TTL_MIN: ${AUTH_TTL_MIN:-480}
      # local http: no Secure flag. Behind HTTPS in real deployments leave this unset (defaults to true in production)
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_STAFF_USERS: ${SEED_STAFF_USERS:-}
      SEED_STAFF_PASSWORD: ${SEED_STAFF_PASSWORD:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:8787:8787"

volumes:
  pgdata:
